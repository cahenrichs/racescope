name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: racescope_test
          POSTGRES_USER: racescope
          POSTGRES_PASSWORD: racescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U racescope -d racescope_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://racescope:racescope@localhost:5432/racescope_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint
        run: make backend-lint
      - name: Test
        run: make backend-test
      - name: Type check
        run: make backend-typecheck
      - name: Build
        run: make backend-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make frontend-lint
      - name: Test
        run: make frontend-test
      - name: Type check
        run: make frontend-typecheck
      - name: Build
        run: make frontend-build
